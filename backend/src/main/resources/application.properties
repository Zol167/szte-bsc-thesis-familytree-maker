spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=SzakdogaJelszo123

familytree.demo-import=true

# Feltöltések: a Spring alapértelmezett 1 MB-os korlátja a valós GEDCOM fájlokat és a fotókat is elutasítaná
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# A túl nagy kérést a Tomcat végigolvassa, így a kliens 413-as JSON választ kap kapcsolatbontás helyett
server.tomcat.max-swallow-size=-1

# A feltöltött fotók könyvtára (a backend munkakönyvtárához képest)
familytree.kep-konyvtar=feltoltesek

# Az id() függvény elavultsági figyelmeztetései (az SDN Long azonosítói is ezt használják) ne árasszák el a naplót
logging.level.org.springframework.data.neo4j.cypher.deprecation=ERROR
# Üres adatbázisnál a még nem létező címkékre/tulajdonságokra (pl. az első egyezés előtt) adott figyelmeztetések
logging.level.org.springframework.data.neo4j.cypher.unrecognized=ERROR
